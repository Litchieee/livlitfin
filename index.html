document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lign-items:center;justify-content:center;padding:0;\">⚙<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"filter:{{ amountsFilter }};transition:filter 0.15s;\">\n\n  <!-- ══ TODAY ══ -->\n  <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:34px 22px 0;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;\">\n        <span style=\"font-size:11.5px;letter-spacing:0.16em;text-transform:uppercase;color:#5FAE82;font-weight:700;\">Safe to move<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:600;color:#5FAE82;background:rgba(95,174,130,0.14);border-radius:12px;padding:5px 10px;\">{{ paceLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"margin-top:8px;font-family:'Fraunces',serif;font-weight:600;font-size:48px;line-height:1;letter-spacing:-0.01em;color:#F5F3EF;\">{{ safeAmt }}<\u002Fspan>\n      <span style=\"margin-top:14px;font-size:15px;line-height:1.55;color:#B7BFC4;\">{{ safeSub }}<\u002Fspan>\n      <span style=\"margin-top:8px;font-size:13px;color:#7A838A;\">{{ safeBreakdown }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasPaydayNudge }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ onGoToPayday }}\" style=\"width:100%;text-align:left;margin:24px 0 0;padding:0 22px;background:none;border:none;cursor:pointer;\">\n        <div style=\"padding:17px 19px;border-radius:18px;background:#14201A;border:1px solid rgba(95,174,130,0.4);display:flex;justify-content:space-between;align-items:center;gap:14px;\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:10.5px;letter-spacing:0.14em;color:#5FAE82;font-weight:700;text-transform:uppercase;\">Needs you<\u002Fspan>\n            <span style=\"font-size:15px;color:#F5F3EF;font-weight:600;\">{{ paydayNudgeText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:34px;height:34px;border-radius:50%;background:#5FAE82;color:#0E0C0A;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;\">→<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasAssignPrompt }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ onOpenAssign }}\" style=\"width:100%;text-align:left;margin:24px 0 0;padding:0 22px;background:none;border:none;cursor:pointer;\">\n        <div style=\"padding:17px 19px;border-radius:18px;background:#171D20;border:1px dashed rgba(95,174,130,0.42);display:flex;justify-content:space-between;align-items:center;gap:14px;\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:15px;color:#F5F3EF;font-weight:600;\">{{ assignHeadline }}<\u002Fspan>\n            <span style=\"font-size:13px;color:#9BA3A9;line-height:1.45;text-align:left;\">{{ assignPromptText }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"color:#5FAE82;font-size:14px;font-weight:700;flex:none;\">Assign<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasOverdue }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin:24px 22px 0;padding:17px 19px;border-radius:18px;background:#241A1A;border:1px solid rgba(209,104,94,0.35);display:flex;flex-direction:column;gap:6px;\">\n        <span style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#D1685E;font-weight:700;\">Past due<\u002Fspan>\n        <span style=\"font-size:14.5px;color:#F5F3EF;line-height:1.5;\">{{ overdueText }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:26px 22px 0;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;\">\n        <span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7A838A;font-weight:600;\">Latest activity<\u002Fspan>\n        <button sc-camel-on-click=\"{{ onOpenLog }}\" style=\"background:none;border:none;color:#5FAE82;font-size:13px;font-weight:600;cursor:pointer;padding:0;\">Log a spend<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasFeed }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ feed }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;\">\n            <span style=\"width:24px;height:24px;border-radius:50%;background:{{ f.avatarBg }};color:{{ f.avatarColor }};font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;\">{{ f.initial }}<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;\">\n              <span style=\"font-size:15px;color:#F5F3EF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ f.title }}<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#7A838A;\">{{ f.when }} · {{ f.sub }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'Fraunces',serif;font-size:19px;color:{{ f.color }};flex:none;\">{{ f.amt }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ onOpenHistory }}\" style=\"margin-top:6px;padding:13px;border-radius:14px;border:1px solid rgba(245,243,239,0.12);background:none;color:#B7BFC4;font-size:13.5px;cursor:pointer;\">See all activity<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noFeed }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:14px;color:#7A838A;line-height:1.5;\">Nothing logged yet. Tap \"Log a spend\" when money moves.<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ ADD ══ -->\n  <sc-if value=\"{{ isAdd }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:20px 22px 0;display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"display:flex;gap:6px;overflow-x:auto;\">\n        <sc-for list=\"{{ addTabs }}\" as=\"a\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"padding:9px 16px;border-radius:999px;border:none;background:{{ a.bg }};color:{{ a.color }};font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;\">{{ a.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isAddSpend }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:center;gap:8px;background:#171D20;border:1px solid rgba(95,174,130,0.35);border-radius:22px;padding:11px 14px;\">\n          <input name=\"quickAdd\" value=\"{{ quickAddText }}\" sc-camel-on-change=\"{{ onQuickAdd }}\" placeholder=\"Type it: spent 42 at harris teeter\" style=\"flex:1;background:none;border:none;outline:none;color:#F5F3EF;font-size:13px;\">\n          <span style=\"width:28px;height:28px;border-radius:50%;background:#5FAE82;color:#0E0C0A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;\">↑<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasQuickAddPreview }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:12px;color:#5FAE82;\">{{ quickAddPreview }}<\u002Fspan>\n        <\u002Fsc-if>\n        <div style=\"display:flex;align-items:center;gap:7px;background:#171D20;border:1px solid rgba(245,243,239,0.1);border-radius:14px;padding:13px 15px;\">\n          <span style=\"font-family:'Fraunces',serif;font-size:26px;color:#9BA3A9;\">$<\u002Fspan>\n          <input name=\"amount\" value=\"{{ logForm.amount }}\" sc-camel-on-change=\"{{ onLogField }}\" inputmode=\"decimal\" placeholder=\"0.00\" style=\"flex:1;background:none;border:none;outline:none;font-family:'Fraunces',serif;font-size:26px;padding:0;\">\n        <\u002Fdiv>\n        <sc-raw-select name=\"bucket\" value=\"{{ logForm.bucket }}\" sc-camel-on-change=\"{{ onLogField }}\" style=\"width:100%;padding:13px;background:#171D20;border:1px solid rgba(245,243,239,0.1);border-radius:14px;font-size:14px;color:#F5F3EF;\">\n          <sc-for list=\"{{ bucketOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <input name=\"note\" value=\"{{ logForm.note }}\" sc-camel-on-change=\"{{ onLogField }}\" placeholder=\"Where — e.g. Harris Teeter\" style=\"width:100%;padding:13px 15px;background:#171D20;border:1px solid rgba(245,243,239,0.1);border-radius:14px;font-size:14px;outline:none;\">\n        <div style=\"display:flex;gap:8px;\">\n          <sc-for list=\"{{ whoChips }}\" as=\"w\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ w.onPick }}\" style=\"flex:1;padding:10px;border-radius:12px;background:{{ w.bg }};border:{{ w.border }};color:{{ w.color }};font-size:13px;cursor:pointer;\">{{ w.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ sheetError }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13.5px;color:#D1685E;line-height:1.45;\">{{ sheetError }}<\u002Fspan><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ onSaveLog }}\" style=\"width:100%;padding:16px;border-radius:14px;border:none;background:#5FAE82;color:#0E0C0A;font-size:15.5px;font-weight:700;cursor:pointer;\">Log it<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAddAssign }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:13.5px;color:#9BA3A9;line-height:1.5;\">{{ assignReason }}<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:7px;background:#171D20;border:1px solid rgba(245,243,239,0.1);border-radius:14px;padding:13px 15px;\">\n          <span style=\"font-family:'Fraunces',serif;font-size:26px;color:#9BA3A9;\">$<\u002Fspan>\n          <input name=\"amount\" value=\"{{ assignForm.amount }}\" sc-camel-on-change=\"{{ onAssignField }}\" inputmode=\"decimal\" placeholder=\"0.00\" style=\"flex:1;background:none;border:none;outline:none;font-family:'Fraunces',serif;font-size:26px;padding:0;\">\n        <\u002Fdiv>\n        <sc-raw-select name=\"to\" value=\"{{ assignForm.to }}\" sc-camel-on-change=\"{{ onAssignField }}\" style=\"width:100%;padding:13px;background:#171D20;border:1px solid rgba(245,243,239,0.1);border-radius:14px;font-size:14px;color:#F5F3EF;\">\n          <sc-for list=\"{{ assignDestOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <input name=\"note\" value=\"{{ assignForm.note }}\" sc-camel-on-change=\"{{ onAssignField }}\" placeholder=\"Where this came from\" style=\"width:100%;padding:13px 15px;background:#171D20;border:1px solid rgba(245,243,239,0.1);border-radius:14px;font-size:14px;outline:none;\">\n        <sc-if value=\"{{ sheetError }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13.5px;color:#D1685E;line-height:1.45;\">{{ sheetError }}<\u002Fspan><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ onSaveAssign }}\" style=\"width:100%;padding:16px;border-radius:14px;border:none;background:#5FAE82;color:#0E0C0A;font-size:15.5px;font-weight:700;cursor:pointer;\">Assign it<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAddAdjust }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:13.5px;color:#9BA3A9;line-height:1.5;\">Correct a balance to what the bank actually says — opens the Accounts list, where each correction is logged.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ onOpenAccounts }}\" style=\"width:100%;padding:16px;border-radius:14px;border:none;background:#5FAE82;color:#0E0C0A;font-size:15.5px;font-weight:700;cursor:pointer;\">Open Accounts<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAddOther }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:13.5px;color:#9BA3A9;line-height:1.5;\">{{ addOtherNote }}<\u002Fspan>\n      <\u002Fsc-if>\n\n      <span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7A838A;font-weight:600;margin-top:8px;\">Recent<\u002Fspan>\n      <sc-for list=\"{{ logRows }}\" as=\"l\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(245,243,239,0.08);gap:10px;\">\n          <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0;\">\n            <span style=\"font-size:14px;color:#F5F3EF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ l.title }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#7A838A;\">{{ l.when }} · {{ l.tag }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:'Fraunces',serif;font-size:16px;color:{{ l.tagColor }};flex:none;\">{{ l.amt }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ ASK ══ -->\n  <sc-if value=\"{{ isAsk }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:24px 22px 0;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7A838A;font-weight:600;\">Can we —<\u002Fspan>\n      <div style=\"background:#171D20;border:1px solid rgba(245,243,239,0.12);border-radius:16px;padding:15px 17px;display:flex;flex-direction:column;gap:9px;\">\n        <input name=\"askWhat\" value=\"{{ askWhat }}\" sc-camel-on-change=\"{{ onAskField }}\" placeholder=\"Asheville trip, Labor Day\" style=\"width:100%;background:none;border:none;outline:none;font-family:'Fraunces',serif;font-size:22px;padding:0;\">\n        <div style=\"height:1px;background:rgba(245,243,239,0.08);\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px;\">\n          <span style=\"font-family:'Fraunces',serif;font-size:32px;color:#9BA3A9;\">$<\u002Fspan>\n          <input name=\"askAmount\" value=\"{{ askAmount }}\" sc-camel-on-change=\"{{ onAskField }}\" inputmode=\"decimal\" placeholder=\"340\" style=\"flex:1;background:none;border:none;outline:none;font-family:'Fraunces',serif;font-size:32px;padding:0;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onRunAsk }}\" style=\"width:100%;padding:15px;border-radius:14px;border:none;background:#5FAE82;color:#0E0C0A;font-size:15px;font-weight:700;cursor:pointer;\">Show me what it costs<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasAskResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:28px 22px 0;\">\n        <span style=\"font-family:'Fraunces',serif;font-weight:300;font-size:50px;line-height:1.05;letter-spacing:-0.02em;color:{{ askVerdictColor }};\">{{ askVerdict }}<\u002Fspan>\n        <div style=\"font-family:'Fraunces',serif;font-style:italic;font-size:24px;line-height:1.32;color:#B7BFC4;margin-top:6px;\">{{ askCost }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin:22px 22px 0;display:flex;flex-direction:column;border-radius:18px;border:1px solid rgba(245,243,239,0.09);overflow:hidden;\">\n        <div style=\"flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 17px;background:#151A1D;\">\n          <span style=\"font-size:14px;color:#9BA3A9;\">Runway<\u002Fspan>\n          <span style=\"font-size:15px;color:#F5F3EF;font-weight:600;\">{{ askRunwayLine }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;height:1px;background:rgba(245,243,239,0.08);\"><\u002Fdiv>\n        <div style=\"flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 17px;background:#151A1D;\">\n          <span style=\"font-size:14px;color:#9BA3A9;\">{{ askGoalName }} paid off<\u002Fspan>\n          <span style=\"font-size:15px;color:#F5F3EF;font-weight:600;\">{{ askPayoffLine }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:none;height:1px;background:rgba(245,243,239,0.08);\"><\u002Fdiv>\n        <div style=\"flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 17px;background:#151A1D;\">\n          <span style=\"font-size:14px;color:#9BA3A9;\">Tightest day<\u002Fspan>\n          <span style=\"font-size:15px;color:#F5F3EF;font-weight:600;\">{{ askTightLine }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px 22px 0;display:flex;flex-direction:column;gap:9px;\">\n        <span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7A838A;font-weight:600;\">Ways to do it<\u002Fspan>\n        <sc-for list=\"{{ askRoutes }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ r.onPick }}\" style=\"width:100%;text-align:left;border-radius:16px;padding:14px 16px;background:{{ r.bg }};border:{{ r.border }};display:flex;flex-direction:column;gap:4px;cursor:pointer;\">\n            <span style=\"font-size:15px;color:#F5F3EF;font-weight:600;\">{{ r.title }}<\u002Fspan>\n            <span style=\"font-size:13px;color:#9BA3A9;line-height:1.45;\">{{ r.detail }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ askCanCommit }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:22px 22px 0;display:flex;gap:11px;\">\n          <button sc-camel-on-click=\"{{ onClearAsk }}\" style=\"flex:1;padding:15px;border-radius:14px;border:1px solid rgba(245,243,239,0.14);background:none;color:#B7BFC4;font-size:15px;cursor:pointer;\">Not now<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onCommitAsk }}\" style=\"flex:2;padding:15px;border-radius:14px;border:none;background:#5FAE82;color:#0E0C0A;font-size:15px;font-weight:700;cursor:pointer;\">{{ askCommitLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ══ AHEAD ══ -->\n  <sc-if value=\"{{ is 02Fdiv>\n      <span style=\"font-size:13.5px;line-height:1.6;color:#9BA3A9;\">Shared costs split the same way income does. Nobody tracks who paid for what — the split is structural, so it just happens.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"margin:24px 22px 0;height:1px;background:rgba(245,243,239,0.08);\"><\u002Fdiv>\n\n    <div style=\"padding:22px 22px 0;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7A838A;font-weight:600;\">Personal, this month<\u002Fspan>\n      <div style=\"display:flex;gap:13px;\">\n        <div style=\"flex:1;background:#151A1D;border:1px solid rgba(245,243,239,0.08);border-radius:16px;padding:17px;display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font-size:13.5px;color:#5FAE82;font-weight:600;\">Liv<\u002Fspan>\n          <span style=\"font-family:'Fraunces',serif;font-size:28px;color:#F5F3EF;\">{{ livPersonal }}<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#7A838A;\">{{ livPersonalStatus }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:#151A1D;border:1px solid rgba(245,243,239,0.08);border-radius:16px;padding:17px;display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font-size:13.5px;color:#9C8FC4;font-weight:600;\">Litch<\u002Fspan>\n          <span style=\"font-family:'Fraunces',serif;font-size:28px;color:#F5F3EF;\">{{ litchPersonal }}<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#7A838A;\">{{ litchPersonalStatus }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:13.5px;line-height:1.6;color:#9BA3A9;\">Equal, flat per check, landed automatically — nobody tracks what either of you spends it on afterward.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"margin:24px 22px 0;height:1px;background:rgba(245,243,239,0.08);\"><\u002Fdiv>\n\n    <div style=\"padding:22px 22px 0;display:flex;flex-direction:column;gap:1 n','exxon','gas','bp ','speedway'],grooming:['salon','barber','haircut','nails','grooming'],life:['life fund','misc','target','amazon']}; }\n  onQuickAdd(e){\n    const text=e.target.value;\n    const m=text.match(/(\\d+(\\.\\d{1,2})?)/);\n    const amt=m?parseFloat(m[1]):null;\n    const note=(m?(text.slice(0,m.index)+text.slice(m.index+m[0].length)):text).replace(/\\b(spent|paid|at|on)\\b/gi,'').trim().replace(/\\s+/g,' ');\n    const hints=this.MERCHANT_HINTS(); const low=text.toLowerCase();\n    let bucketId='';\n    Object.keys(hints).forEach(bid=>{ if(bucketId)return; if(hints[bid].some(k=>low.indexOf(k)>=0)){ const b=(this.state.buckets||[]).find(x=>x.id===bid); if(b)bucketId=b.id; } });\n    const b=(this.state.buckets||[]).find(x=>x.id===bucketId);\n    this.setState(p=>({\n      quickAddText:text,\n      quickAddPreview:(amt&&text.trim())?('Parsed → Spend · '+this.m0(amt)+(b?(' · '+b.name):'')+' · House'):'',\n      logForm:Object.assign({},p.logForm,{amount:amt!=null?String(amt):p.logForm.amount,note:note||p.logForm.note,bucket:bucketId||p.logForm.bucket}),\n    }));\n  }\n  onAssignField(e){ const {name,value}=e.target; this.setState(p=>({assignForm:Object.assign({},p.assignForm,{[name]:value}),sheetError:''})); }\n  onAskField(e){ const {name,value}=e.target; this.setState({[name]:value}); }\n  closeSheets(){ this.setState({logOpen:false,assignOpen:false,sheetError:''}); }\n  openLog(){ const first=(this.state.buckets||[])[0]; this.setState({logOpen:true,logForm:{amount:'',bucket:first?first.id:'',note:'',who:'joint'},sheetError:''}); }\n  openAssign(){\n    const sug=this.assignSuggestion(this.state); const u=this.unassigned(this.state);\n    this.setState({assignOpen:true,assignForm:{amount:u>0.5?u.toFixed(2):'',to:sug.value,note:''},sheetError:''});\n  }\n  saveLog(){\n    const f=this.state.logForm; const amt=parseFloat(f.amount);\n    if(!amt||amt<=0){ this.setState({sheetError:'Enter an amount.'}); return; }\n    if(!f.bucket){ this.setState({shee    const amt=parseFloat(this.state.askAmount);\n    if(!amt||amt<=0){ this.setState({askResult:null,sheetError:''}); this.showToast('Enter an amount first.'); return; }\n    const n=this.state;\n    const before=this.runwayInfo(n);\n    const simAfter=Object.assign({},n,{house:n.house-amt});\n    const afterProj=this.projectDays(simAfter,120);\n    const afterDays=afterProj.firstNeg?afterProj.firstNeg.i:120;\n    const payBefore=this.payoffMonths(n,0,false);\n    const payAfterM=this.payoffMonths(Object.assign({},n,{discover:n.discover}),0,false);\n    const skipPay=this.payoffMonths(n,0,true);\n    const safe=this.unassigned(n);\n    const misc=this.miscBalance(n);\n    const weeks=4, weekly=amt/weeks;\n    const wd=new Date(this.TODAY()); wd.setDate(wd.getDate()+weeks*7);\n    const monthsSlip=skipPay.months!=null&&payBefore.months!=null?skipPay.months-payBefore.months:null;\n    const interestCost=amt*(n.discoverApr/1200)*(monthsSlip||1);\n    this.setState({askResult:{\n      amt, safe, misc,\n      runwayBefore:before.days, runwayAfter:afterDays, runwayCapped:before.capped,\n      payBefore:payBefore.date, payAfter:skipPay.date,\n      low:afterProj.low, weekly, weeklyDate:wd, monthsSlip, interestCost,\n      overSafe:amt>safe+0.005,\n    },askRoute:0});\n  }\n  commitAsk(route){\n    const r=this.state.askResult; if(!r)return;\n    if(route==null) route=this.state.askRoute||0;\n    const what=(this.state.askWhat||'').trim()||'Planned spend';\n    if(route===2){ this.setState({askResult:null,askWhat:'',askAmount:''}); this.showToast('Saved as a plan — nothing moved.'); return; }\n    if(r.overSafe){ this.showToast('Only '+this.m0(Math.max(0,r.safe))+' is safe to move right now.'); return; }\n    if(route===0 && Math.max(0,r.misc) < r.amt-0.005){ this.showToast('Misc only holds '+this.m0(Math.max(0,r.misc))+'.'); return; }\n    const amt=r.amt;\n    this.commit(n=>{\n      if(route===0){\n        const mb=n.buckets.find(b=>b.id==='misc');\n        if(mb){ mb.ava
